<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Answers — Cambridge 19 Test 1</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f4f6f9; padding: 20px; line-height: 1.7; }
        .container { max-width: 900px; margin: 0 auto; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 30px; }
        h1 { color: #1f3a5f; margin-bottom: 25px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        h2 { color: #1f3a5f; margin: 25px 0 15px; font-size: 18px; }
        .answer-row { display: flex; padding: 10px 12px; border-bottom: 1px solid #eee; align-items: center; }
        .q-num { width: 40px; font-weight: bold; color: #1f3a5f; }
        .user-ans { flex: 1; padding: 6px 10px; background: #e6f0ff; border-radius: 4px; margin: 0 10px; }
        .correct-ans { flex: 1; padding: 6px 10px; background: #e8f5e9; border-radius: 4px; }
        .status { width: 80px; text-align: center; font-weight: bold; }
        .correct { color: #10b981; }
        .incorrect { color: #dc2626; }
        .empty { color: #999; font-style: italic; }
        .nav { margin-top: 30px; display: flex; gap: 15px; }
        .btn { padding: 10px 18px; border-radius: 4px; text-decoration: none; font-weight: bold; }
        .back { background: #6b7280; color: white; }
        .print { background: #1f3a5f; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Your Answers — Cambridge 19 Test 1 — Listening</h1>

        <h2>Part 1 — Questions 1–10</h2>
        <div id="part1"></div>

        <h2>Part 2 — Questions 11–20</h2>
        <div id="part2"></div>

        <h2>Part 3 — Questions 21–30</h2>
        <div id="part3"></div>

        <h2>Part 4 — Questions 31–40</h2>
        <div id="part4"></div>

        <div class="nav">
            <a href="listening-cambridge19-test1.html" class="btn back">← Back to Test</a>
            <a href="#" class="btn print" onclick="window.print()">🖨️ Print / Save as PDF</a>
        </div>
    </div>

<script>
// ⚠️ MUST MATCH EXACT STORAGE KEY FROM YOUR LISTENING PAGE
const STORAGE_KEY = 'Cambridge19_Test1_Listening';

// Official answer key — verify these match Cambridge 19
const ANSWERS = {
    1: '195',
    2: 'stream',
    3: 'evidence',
    4: 'map',
    5: 'history',
    6: 'instruments',
    7: 'achievement',
    8: 'skills',
    9: '6.50',
    10: 'teachers',
    11: 'C',
    12: 'A',
    13: 'C',
    14: 'C',
    15: 'A',
    16: 'G',
    17: 'E',
    18: 'F',
    19: 'H',
    20: 'D',
    21: 'B,D',
    22: '',
    23: 'A,D',
    24: '',
    25: 'F',
    26: 'G',
    27: 'C',
    28: 'B',
    29: 'H',
    30: 'E',
    31: 'fenced',
    32: 'grandson',
    33: 'artifacts',
    34: 'farming',
    35: 'circular',
    36: 'tools',
    37: 'family',
    38: 'winter',
    39: 'soil',
    40: 'rainfall'
};

function getAnswer(qNum) {
    return (localStorage.getItem(`${STORAGE_KEY}_q${qNum}`) || '').trim();
}

function renderQuestion(qNum) {
    const userAns = getAnswer(qNum);
    const correctAns = ANSWERS[qNum] || '';
    
    let statusHtml = '';
    let userDisplay = userAns || '<span class="empty">No answer provided</span>';
    
    if (!userAns) {
        statusHtml = '<span class="status empty">—</span>';
    } else if (userAns.toUpperCase() === correctAns.toUpperCase()) {
        statusHtml = '<span class="status correct">✓ CORRECT</span>';
    } else {
        statusHtml = '<span class="status incorrect">✗ INCORRECT</span>';
    }
    
    return `
        <div class="answer-row">
            <span class="q-num">${qNum}</span>
            <span class="user-ans"><strong>Your Answer:</strong> ${userDisplay}</span>
            <span class="correct-ans"><strong>Correct Answer:</strong> ${correctAns || '—'}</span>
            ${statusHtml}
        </div>
    `;
}

function renderPart(containerId, startQ, endQ) {
    const container = document.getElementById(containerId);
    let html = '';
    for (let q = startQ; q <= endQ; q++) {
        html += renderQuestion(q);
    }
    container.innerHTML = html;
}

// Run on load
document.addEventListener('DOMContentLoaded', () => {
    console.log('Storage Key used:', STORAGE_KEY);
    console.log('Sample Q1 value:', localStorage.getItem(`${STORAGE_KEY}_q1`)); // Debug — check browser console
    
    renderPart('part1', 1, 10);
    renderPart('part2', 11, 20);
    renderPart('part3', 21, 30);
    renderPart('part4', 31, 40);
});
</script>
</body>
</html>
